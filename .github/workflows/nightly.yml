name: Nightly Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
      timezone: "America/Chicago"

jobs:
  build:
    name: Build MeowMod Windows Zip
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --target Minecraft.Client

      - name: Package build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          New-Item -ItemType Directory -Force package\mods | Out-Null
          New-Item -ItemType Directory -Force dist | Out-Null

          $exe = Get-ChildItem -Path build -Recurse -Filter "Minecraft.Client.exe" | Select-Object -First 1

          if (-not $exe) {
            Write-Error "Could not find Minecraft.Client.exe. Change the exe name in nightly.yml."
            exit 1
          }

          Copy-Item $exe.FullName package\

          Get-ChildItem $exe.Directory.FullName -Filter "*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination package\ -Force

          if (Test-Path "mods") {
            Copy-Item "mods\*" "package\mods\" -Recurse -Force
          }

          @"
          MeowMod Nightly Build

          Commit:
          $env:GITHUB_SHA

          How to use:
          1. Extract this zip.
          2. Add any required legal Minecraft/LCE runtime files or assets locally.
          3. Put mod DLLs inside the mods folder.
          4. Run Minecraft.Client.exe.
          "@ | Out-File package\README.txt -Encoding utf8

          Compress-Archive -Path package\* -DestinationPath dist\MeowMod-Nightly-Windows.zip -Force

      - name: Upload nightly zip
        uses: actions/upload-artifact@v7
        with:
          name: MeowMod-Nightly-Windows
          path: dist/MeowMod-Nightly-Windows.zip
          retention-days: 30